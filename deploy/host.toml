# Where LedgerWorld runs and what the deploy sets there. Names only: every value in [secrets] lives
# in the host's secret store; [settings] are the non-secret values the deploy exports.
#
# Target: one small always-on machine running deploy/compose.yml (app, sim worker, PostgreSQL 16,
# Redis 7). The app listens on the machine's loopback; a reverse proxy or tunnel on the machine
# gives it the public address recorded as LEDGERWORLD_URL.
#
# Apply:
#   docker compose -f deploy/compose.yml --env-file <host env file> up -d --build
#   then GET $LEDGERWORLD_URL/api/v1/health answers {"ok": true, ...}

[host]
target = "compose"
compose_file = "deploy/compose.yml"
project = "ledgerworld"
public_service = "app"
internal_port = 5001
url_env = "LEDGERWORLD_URL"
health_path = "/api/v1/health"

# Which compose service runs which LEDGERWORLD_ROLE.
[roles]
app = "api"
sim = "sim"

[secrets]
# Needed from the first deploy: the write routes admit nobody without it.
required = ["LEDGERWORLD_DEMO_TOKEN"]
# Set when the sandbox keys land, together with AIRWALLEX_MODE = "sandbox"; only the app gets them.
# Not before the upstream engine's simulation subprocesses, which the app starts with a copy of
# its own environment (backend/app/services/simulation_runner.py), run with these names removed.
airwallex = ["AIRWALLEX_CLIENT_ID", "AIRWALLEX_API_KEY", "AIRWALLEX_WEBHOOK_SECRET"]
# Set for a live model and graph memory; without them the model is scripted. Only the app gets
# them: the sim worker runs scripted families and builds no model client.
model = ["LLM_API_KEY", "LLM_BOOST_API_KEY", "ZEP_API_KEY"]

[settings]
AIRWALLEX_MODE = "fake"
AIRWALLEX_CONNECTED = "auto"
LEDGERWORLD_LLM_DAILY_USD = "5"
