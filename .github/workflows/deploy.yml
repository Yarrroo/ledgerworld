name: Deploy LedgerWorld

# Run on the compose host, using a dedicated runner labelled ledgerworld. Set the repository
# variable LEDGERWORLD_ENV_FILE to an absolute host env-file path OUTSIDE the runner checkout.
# The file holds the host settings/secrets from deploy/host.toml; checkout must never remove it.
# Host tools: Docker Compose and Python 3. Set LEDGERWORLD_FREEZE=0 for deployments and provide
# LEDGERWORLD_FREEZE_READ_TOKEN as a repository secret with only Variables: read for this repo.
# To freeze: set the repository variable to 1, then wait for active Deploy runs to finish BEFORE
# submission. The host reads the current variable after building, immediately before activation;
# no distributed check can revoke a compose activation that has already started.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledgerworld-deploy
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse frozen deployment
        if: ${{ vars.LEDGERWORLD_FREEZE == '1' }}
        run: |
          printf '%s\n' 'Deployment refused: LEDGERWORLD_FREEZE=1.' >&2
          exit 1

  deploy:
    needs: freeze
    # A dispatch on any other ref must never put that ref on the demo host.
    if: ${{ vars.LEDGERWORLD_FREEZE != '1' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: [self-hosted, linux, ledgerworld]
    timeout-minutes: 20
    env:
      LEDGERWORLD_ENV_FILE: ${{ vars.LEDGERWORLD_ENV_FILE }}
      VITE_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
    steps:
      - name: Validate host configuration
        id: host
        shell: bash
        run: |
          set -euo pipefail
          case "$LEDGERWORLD_ENV_FILE" in
            /*) ;;
            *) printf '%s\n' 'LEDGERWORLD_ENV_FILE must be an absolute host path.' >&2; exit 1 ;;
          esac
          env_file=$(realpath -e -- "$LEDGERWORLD_ENV_FILE")
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          case "$env_file" in
            "$workspace"|"$workspace"/*)
              printf '%s\n' 'The host env file must be outside the checkout.' >&2
              exit 1 ;;
          esac
          test -f "$env_file" && test -r "$env_file"
          printf 'env_file=%s\n' "$env_file" >> "$GITHUB_OUTPUT"
          docker compose version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy compose services
        if: ${{ vars.LEDGERWORLD_FREEZE != '1' }}
        shell: bash
        env:
          LEDGERWORLD_ENV_FILE: ${{ steps.host.outputs.env_file }}
          FREEZE_READ_TOKEN: ${{ secrets.LEDGERWORLD_FREEZE_READ_TOKEN }}
        run: |
          set -euo pipefail
          docker compose --project-name ledgerworld -f deploy/compose.yml \
            --env-file "$LEDGERWORLD_ENV_FILE" build
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ.get("FREEZE_READ_TOKEN")
          if not token:
              raise SystemExit("Deployment refused: freeze reader is not configured")
          url = (os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"]
                 + "/actions/variables/LEDGERWORLD_FREEZE")
          request = Request(url, headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit("Deployment refused: freeze state is unavailable")
              state = json.load(response)
          if not isinstance(state, dict) or state.get("value") != "0":
              raise SystemExit("Deployment refused: freeze is set or unavailable")
          PY
          docker compose --project-name ledgerworld -f deploy/compose.yml \
            --env-file "$LEDGERWORLD_ENV_FILE" up --detach --no-build --wait --wait-timeout 180
