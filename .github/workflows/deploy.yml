name: Deploy LedgerWorld

# Run on the compose host, using a dedicated runner labelled ledgerworld. Set the repository
# variable LEDGERWORLD_ENV_FILE to an absolute host env-file path OUTSIDE the runner checkout.
# The file holds the host settings/secrets from deploy/host.toml; checkout must never remove it.
# Set the repository variable LEDGERWORLD_FREEZE=1 at submission. No deployment runs while frozen.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledgerworld-deploy
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse frozen deployment
        if: ${{ vars.LEDGERWORLD_FREEZE == '1' }}
        run: |
          printf '%s\n' 'Deployment refused: LEDGERWORLD_FREEZE=1.' >&2
          exit 1

  deploy:
    needs: freeze
    # A dispatch on any other ref must never put that ref on the demo host.
    if: ${{ vars.LEDGERWORLD_FREEZE != '1' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: [self-hosted, linux, ledgerworld]
    timeout-minutes: 20
    env:
      LEDGERWORLD_ENV_FILE: ${{ vars.LEDGERWORLD_ENV_FILE }}
      VITE_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
    steps:
      - name: Validate host configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$LEDGERWORLD_ENV_FILE" in
            /*) ;;
            *) printf '%s\n' 'LEDGERWORLD_ENV_FILE must be an absolute host path.' >&2; exit 1 ;;
          esac
          env_file=$(realpath -e -- "$LEDGERWORLD_ENV_FILE")
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          case "$env_file" in
            "$workspace"|"$workspace"/*)
              printf '%s\n' 'The host env file must be outside the checkout.' >&2
              exit 1 ;;
          esac
          test -f "$env_file" && test -r "$env_file"
          docker compose version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy compose services
        # Re-check at the mutating step as well as at job admission.
        if: ${{ vars.LEDGERWORLD_FREEZE != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          docker compose --project-name ledgerworld -f deploy/compose.yml \
            --env-file "$LEDGERWORLD_ENV_FILE" up --detach --build --wait --wait-timeout 180
